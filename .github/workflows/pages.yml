name: Deploy financial calendar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_company_graphics.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Cancel the stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.request(
                "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: "08e4b5e96ed8f4be3b9554f7e147bd4499393cef"
                }
              );
              core.info(`Cancelled stale Pages deployment (HTTP ${response.status}).`);
            } catch (error) {
              if (error.status === 404) {
                core.info("The stale Pages deployment is already cleared.");
              } else {
                throw error;
              }
            }
      - id: deployment
        uses: actions/deploy-pages@v4
