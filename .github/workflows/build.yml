name: Validate financial calendar data
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - name: Publish verified upcoming earnings notices
        run: python scripts/publish.py
        env:
          BD_API_KEY: ${{ secrets.BD_API_KEY }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Refresh calendar and publish verified earnings notices'
